name: Build and publish web UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release
      - name: Package UI and update manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/ui
          cp -R build/web/. release/ui/
          (cd release && zip -qr update.zip ui)
          SHA256="$(sha256sum release/update.zip | awk '{print $1}')"
          VERSION="${GITHUB_RUN_NUMBER}"
          BUNDLE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/update.zip"
          printf '{"version":%s,"sha256":"%s","bundleUrl":"%s"}\n' "$VERSION" "$SHA256" "$BUNDLE_URL" > release/manifest.json
          printf '{"version":%s,"sha256":"%s"}\n' "$VERSION" "$SHA256" > release/version.json
          cp -R build/web/. release/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
